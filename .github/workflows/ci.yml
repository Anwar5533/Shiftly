name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: shiftly
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install pnpm
        run: npm i -g pnpm
        
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/shiftly
        run: pnpm install
        
      - name: Run lint, test, build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/shiftly
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pnpm audit --prod
          pnpm turbo run lint build
          pnpm turbo run test -- --coverage

      - name: Install Playwright Browsers
        run: pnpm --filter @shiftly/web exec playwright install --with-deps

      - name: Start Backend Services
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://user:pass@localhost:5432/shiftly
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KAFKA_BROKERS: localhost:9092
          JWT_ACCESS_SECRET: test-access-secret-must-be-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-must-be-32-chars-long
          AWS_S3_BUCKET: test-bucket
          AWS_SES_FROM_EMAIL: test@example.com
          OPENSEARCH_ENDPOINT: http://localhost:9200
          OPENAI_API_KEY: sk-test-key
          IDENTITY_URL: http://localhost:3001
          USER_URL: http://localhost:3002
          JOBS_URL: http://localhost:3003
          APPLICATIONS_URL: http://localhost:3004
          ANALYTICS_URL: http://localhost:3005
          SEARCH_URL: http://localhost:3006
          PAYMENTS_URL: http://localhost:3007
          DOCUMENTS_URL: http://localhost:3008
          NOTIFICATIONS_URL: http://localhost:3009
        run: |
          pnpm turbo run start --filter="!@shiftly/web" &
          npx wait-on http://localhost:3000/health/live -t 120000

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/shiftly
        run: pnpm turbo run test:e2e

  docker-build:
    name: Docker Build
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: 
          - identity-service
          - user-service
          - jobs-service
          - applications-service
          - analytics-service
          - api-gateway
          - documents-service
          - notifications-service
          - payments-service
          - search-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: APP_NAME=${{ matrix.app }}
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/your-org/${{ matrix.app }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/your-org/${{ matrix.app }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
