name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: shiftly
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install pnpm
        run: npm i -g pnpm
        
      - name: Install dependencies
        run: pnpm install
        
      - name: Run lint, test, build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/shiftly
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pnpm turbo run lint test build

  docker-build:
    name: Docker Build
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: 
          - identity-service
          - user-service
          - jobs-service
          - applications-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: APP_NAME=${{ matrix.app }}
          push: false
          tags: ghcr.io/your-org/${{ matrix.app }}:latest
