name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: shiftly
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      zookeeper:
        image: confluentinc/cp-zookeeper:7.7.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.7.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_LOG_RETENTION_HOURS: 168
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
      opensearch:
        image: opensearchproject/opensearch:2.17.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
        ports:
          - 9200:9200
      localstack:
        image: localstack/localstack:3.8.0
        env:
          SERVICES: s3,ses,sns
          DEFAULT_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install pnpm
        run: npm i -g pnpm
        
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/shiftly
        run: pnpm install
        
      - name: Run lint, test, build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/shiftly
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          pnpm audit --prod
          pnpm turbo run lint build
          pnpm turbo run test -- --coverage

      - name: Install Playwright Browsers
        run: pnpm --filter @shiftly/web exec playwright install --with-deps

      - name: Run Backend & E2E Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/shiftly
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          KAFKA_BROKERS: 127.0.0.1:9092
          JWT_ACCESS_SECRET: test-access-secret-must-be-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-must-be-32-chars-long
          AWS_S3_BUCKET: test-bucket
          AWS_SES_FROM_EMAIL: test@example.com
          OPENSEARCH_ENDPOINT: http://127.0.0.1:9200
          OPENAI_API_KEY: sk-test-key
          IDENTITY_URL: http://127.0.0.1:3003
          USER_URL: http://127.0.0.1:3004
          JOBS_URL: http://127.0.0.1:3005
          APPLICATIONS_URL: http://127.0.0.1:3006
          ANALYTICS_URL: http://127.0.0.1:3007
          SEARCH_URL: http://127.0.0.1:3008
          PAYMENTS_URL: http://127.0.0.1:3009
          DOCUMENTS_URL: http://127.0.0.1:3010
          NOTIFICATIONS_URL: http://127.0.0.1:3011
        run: |
          pnpm turbo run db:migrate:deploy
          pnpm turbo run db:seed
          pnpm turbo run start --filter="!@shiftly/web" &
          npx wait-on tcp:3000 tcp:3003 tcp:3004 tcp:3005 tcp:3006 tcp:3007 tcp:3008 tcp:3009 tcp:3010 tcp:3011 -t 120000
          pnpm turbo run test:e2e

  docker-build:
    name: Docker Build
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: 
          - identity-service
          - user-service
          - jobs-service
          - applications-service
          - analytics-service
          - api-gateway
          - documents-service
          - notifications-service
          - payments-service
          - search-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: APP_NAME=${{ matrix.app }}
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/your-org/${{ matrix.app }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/your-org/${{ matrix.app }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
