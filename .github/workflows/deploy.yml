name: SHIFTLY CD

on:
  push:
    branches:
      - release-dev
      - release-uat
      - release-mo
      - release-prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Deploy to DEV ──────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to DEV Environment
        run: |
          echo "Deploying to DEV environment..."
          echo "Image tag: ci-${{ github.sha }}"

          # Validate Kustomize overlay manifests
          kubectl kustomize infrastructure/k8s/overlays/dev

          # If cluster config is present, apply to cluster
          if [ -f ~/.kube/config ]; then
            echo "Applying manifests to Kubernetes cluster..."
            kubectl apply -k infrastructure/k8s/overlays/dev
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            kubectl set image deployment/api-gateway api-gateway=ghcr.io/${REPO_OWNER}/api-gateway:ci-${{ github.sha }} -n dev || true
            kubectl rollout status deployment/api-gateway -n dev --timeout=60s || true
          else
            echo "ℹ️ Manifests validated successfully via Kustomize. (Configure KUBECONFIG in repository secrets to deploy to a live cluster.)"
          fi

  # ─── Deploy to UAT ──────────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy to UAT
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to UAT Environment
        run: |
          echo "Deploying to UAT environment..."
          echo "Image tag: ci-${{ github.sha }}"

          # Validate Kustomize overlay manifests
          kubectl kustomize infrastructure/k8s/overlays/uat

          # If cluster config is present, apply to cluster
          if [ -f ~/.kube/config ]; then
            echo "Applying manifests to Kubernetes cluster..."
            kubectl apply -k infrastructure/k8s/overlays/uat
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            kubectl set image deployment/api-gateway api-gateway=ghcr.io/${REPO_OWNER}/api-gateway:ci-${{ github.sha }} -n uat || true
            kubectl rollout status deployment/api-gateway -n uat --timeout=60s || true
          else
            echo "ℹ️ Manifests validated successfully via Kustomize. (Configure KUBECONFIG in repository secrets to deploy to a live cluster.)"
          fi

  # ─── Deploy to MO (Model Office) ────────────────────────────────────────────
  deploy-mo:
    name: Deploy to MO
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-mo'
    runs-on: ubuntu-latest
    environment: mo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to MO Environment
        run: |
          echo "Deploying to MO environment..."
          echo "Image tag: ci-${{ github.sha }}"

          # Validate Kustomize overlay manifests
          kubectl kustomize infrastructure/k8s/overlays/mo

          # If cluster config is present, apply to cluster
          if [ -f ~/.kube/config ]; then
            echo "Applying manifests to Kubernetes cluster..."
            kubectl apply -k infrastructure/k8s/overlays/mo
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            kubectl set image deployment/api-gateway api-gateway=ghcr.io/${REPO_OWNER}/api-gateway:ci-${{ github.sha }} -n mo || true
            kubectl rollout status deployment/api-gateway -n mo --timeout=60s || true
          else
            echo "ℹ️ Manifests validated successfully via Kustomize. (Configure KUBECONFIG in repository secrets to deploy to a live cluster.)"
          fi

  # ─── Deploy to PROD ─────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to PROD
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config 2>/dev/null || echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to PROD Environment
        run: |
          echo "Deploying to PROD environment..."
          echo "Image tag: ci-${{ github.sha }}"

          # Validate Kustomize overlay manifests
          kubectl kustomize infrastructure/k8s/overlays/prod

          # If cluster config is present, apply to cluster
          if [ -f ~/.kube/config ]; then
            echo "Applying manifests to Kubernetes cluster..."
            kubectl apply -k infrastructure/k8s/overlays/prod
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            kubectl set image deployment/api-gateway api-gateway=ghcr.io/${REPO_OWNER}/api-gateway:ci-${{ github.sha }} -n prod || true
            kubectl rollout status deployment/api-gateway -n prod --timeout=60s || true
          else
            echo "ℹ️ Manifests validated successfully via Kustomize. (Configure KUBECONFIG in repository secrets to deploy to a live cluster.)"
          fi
