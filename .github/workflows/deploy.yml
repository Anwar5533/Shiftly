name: SHIFTLY CD

on:
  push:
    branches:
      - release-dev
      - release-uat
      - release-mo
      - release-prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Deploy to DEV ──────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to Dev Environment
        run: |
          echo "Deploying to DEV environment..."
          echo "Image tag: ci-${{ github.sha }}"
          
          # Kubernetes Deployment
          kubectl apply -k infrastructure/k8s/overlays/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          kubectl set image deployment/api-gateway api-gateway=ghcr.io/your-org/api-gateway:ci-${{ github.sha }} -n dev
          kubectl rollout status deployment/api-gateway -n dev

  # ─── Deploy to UAT ──────────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy to UAT
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Deploy to UAT Environment
        run: |
          echo "Deploying to UAT environment..."
          echo "Image tag: ci-${{ github.sha }}"
          
          # Kubernetes Deployment
          kubectl apply -k infrastructure/k8s/overlays/uat
          kubectl set image deployment/api-gateway api-gateway=ghcr.io/your-org/api-gateway:ci-${{ github.sha }} -n uat
          kubectl rollout status deployment/api-gateway -n uat

  # ─── Deploy to MO (Model Office) ────────────────────────────────────────────
  deploy-mo:
    name: Deploy to MO
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-mo'
    runs-on: ubuntu-latest
    environment: mo
    steps:
      - name: Deploy to MO Environment
        run: |
          echo "Deploying to MO environment..."
          echo "Image tag: ci-${{ github.sha }}"
          
          # Kubernetes Deployment
          kubectl apply -k infrastructure/k8s/overlays/mo
          kubectl set image deployment/api-gateway api-gateway=ghcr.io/your-org/api-gateway:ci-${{ github.sha }} -n mo
          kubectl rollout status deployment/api-gateway -n mo

  # ─── Deploy to PROD ─────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to PROD
    if: github.event_name == 'push' && github.ref == 'refs/heads/release-prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy to PROD Environment
        run: |
          echo "Deploying to PROD environment..."
          echo "Image tag: ci-${{ github.sha }}"
          
          # Kubernetes Deployment
          kubectl apply -k infrastructure/k8s/overlays/prod
          kubectl set image deployment/api-gateway api-gateway=ghcr.io/your-org/api-gateway:ci-${{ github.sha }} -n prod
          kubectl rollout status deployment/api-gateway -n prod
