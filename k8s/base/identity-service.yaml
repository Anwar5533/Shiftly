apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: shiftly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: your-registry/identity-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shiftly-secrets
                  key: DATABASE_URL
            - name: KAFKA_BROKERS
              value: "kafka.shiftly.svc.cluster.local:9092"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: shiftly
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
