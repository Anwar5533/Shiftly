apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shiftly-ingress
  namespace: shiftly
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: identity-service
                port:
                  number: 3000
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 3000
          - path: /api/jobs(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: jobs-service
                port:
                  number: 3000
          - path: /api/applications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: applications-service
                port:
                  number: 3000
