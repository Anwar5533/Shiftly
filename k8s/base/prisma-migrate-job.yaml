apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: shiftly
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: your-registry/identity-service:latest
        command: ["npx", "prisma", "migrate", "deploy"]
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: shiftly-secrets
                key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 4
