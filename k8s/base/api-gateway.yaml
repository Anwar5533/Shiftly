apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shiftly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: your-registry/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: IDENTITY_URL
              value: "http://identity-service.shiftly.svc.cluster.local:3001"
            - name: USER_URL
              value: "http://user-service.shiftly.svc.cluster.local:3002"
            - name: JOBS_URL
              value: "http://jobs-service.shiftly.svc.cluster.local:3003"
            - name: APPLICATIONS_URL
              value: "http://applications-service.shiftly.svc.cluster.local:3004"
            - name: ANALYTICS_URL
              value: "http://analytics-service.shiftly.svc.cluster.local:3005"
            - name: SEARCH_URL
              value: "http://search-service.shiftly.svc.cluster.local:3006"
            - name: PAYMENTS_URL
              value: "http://payments-service.shiftly.svc.cluster.local:3009"
            - name: DOCUMENTS_URL
              value: "http://documents-service.shiftly.svc.cluster.local:3008"
            - name: NOTIFICATIONS_URL
              value: "http://notifications-service.shiftly.svc.cluster.local:3007"
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: shiftly-secrets
                  key: JWT_ACCESS_SECRET
            - name: REDIS_HOST
              value: "redis.shiftly.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shiftly
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
